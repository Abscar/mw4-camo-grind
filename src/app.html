<!doctype html>
<html lang="en" data-theme="blackout">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#23160D" />
		<meta name="description" content="Tick off your Modern Warfare 4 Multiplayer camo grind: Gold, Platinum, Harmonic Break, Divergence and Mastery." />
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307080A'/%3E%3Cpath d='M16 5l9 5v12l-9 5-9-5V10z' fill='none' stroke='%23FF3434' stroke-width='2.5'/%3E%3Cpath d='M11 17l3.5 3.5L21 13' fill='none' stroke='%23FF3434' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
		/>
		<script>
			// Apply the saved theme before the page paints, so there is no flash of the wrong colours.
			// Keys must match STORAGE_KEY / LEGACY_KEY in src/lib/progress.svelte.ts.
			// Compact mode and the welcome screen are decided here too, before the first paint.
			(function () {
				var html = document.documentElement;
				var compact = false;
				try {
					var s = JSON.parse(localStorage.getItem('mw4-camo-grind:v2') || 'null');
					var t = s && s.prefs && s.prefs.theme;
					compact = !!(s && s.prefs && s.prefs.compact === true);
					if (!t) {
						var o = JSON.parse(localStorage.getItem('mw4-camo-grind-v1') || 'null');
						t = o && o.theme;
					}
					// the three removed looks (Field Manual, Neon Grid, Command Center) open in Steel (themes.ts themeFrom)
					if (t === 'field' || t === 'neon' || t === 'command') t = 'steel';
					if (t === 'blackout' || t === 'steel' || t === 'matrix') html.setAttribute('data-theme', t);
				} catch (e) {}
				if (compact) html.setAttribute('data-compact', '');
				// Battery saver (src/lib/motion.svelte.ts; the old pause button's "1" counts as on)
				var saver = false;
				try {
					saver = localStorage.getItem('mw4-camo-grind:saver') === 'on' || localStorage.getItem('mw4-camo-grind:still') === '1';
				} catch (e) {}
				if (saver) {
					html.setAttribute('data-still', '');
					html.setAttribute('data-saver', '');
				}
				// The welcome screen shows every time the page opens (the user's ask 2026-11-11; it was once
				// a day), never in compact mode or Battery saver; any tap or key skips it.
				var boot = compact || saver ? 'off' : 'on';
				html.setAttribute('data-boot', boot);
				if (boot === 'on') {
					var skip = function () {
						html.setAttribute('data-boot', 'off');
						removeEventListener('pointerdown', skip, true);
						removeEventListener('keydown', skip, true);
					};
					addEventListener('pointerdown', skip, true);
					addEventListener('keydown', skip, true);
					setTimeout(skip, 2400);
				}
				// "Get it as an app": the browser's install offer can come before the page's code runs,
				// so park it here for src/lib/install.svelte.ts
				addEventListener('beforeinstallprompt', function (e) {
					e.preventDefault();
					window.__mw4InstallPrompt = e;
				});
				// pause the decoration while the tab is hidden
				document.addEventListener('visibilitychange', function () {
					if (document.hidden) html.setAttribute('data-page-hidden', '');
					else {
						html.removeAttribute('data-page-hidden');
						soon(); // animations that started while hidden join the frame cap now
					}
				});
				/*
				 * The decoration's frame cap (2026-11-20, the user's ask: less CPU / battery). Every endless
				 * animation (smoke, glints, glowing eyes, bulbs …) is taken over here: paused, and moved on by
				 * hand FPS (24) times a second, so the browser draws the decoration at most 24 frames a second
				 * instead of the screen's 60–180 Hz (it was ~180 a second on a 179 Hz PC screen). It also
				 * stands still while it is off screen (an IntersectionObserver per animated element), while
				 * the tab is hidden, and in Battery saver (data-still; src/lib/motion.svelte.ts): a still
				 * picture, nothing hidden. One-off animations (a tick's pop, the kill feed) are left alone.
				 * Here rather than in the page's code, so it already holds before that code has loaded (and in
				 * the offline file). window.__mw4fx is read by the net_graph (NetGraph.svelte).
				 */
				var FPS = 24; // like film: smooth enough for slow smoke and glints
				// endless animations this script moves (all paused) -> their time. The time is kept here, never
				// read back: reading a CSS animation's playState / currentTime makes the browser redo the
				// page's style and layout, which per animation per frame cost more than the animations did.
				var held = new Map();
				var seen = new WeakSet(); // looked at once (one-off or someone else's)
				var shown = new WeakMap(); // animated element -> on screen (IntersectionObserver)
				var io =
					typeof IntersectionObserver === 'function'
						? new IntersectionObserver(
								function (entries) {
									for (var i = 0; i < entries.length; i++) shown.set(entries[i].target, entries[i].isIntersecting);
								},
								{ rootMargin: '120px' }
							)
						: null;
				var fx = (window.__mw4fx = { fps: FPS, held: 0, moving: 0, steps: 0 });
				function endless(a) {
					var e = a.effect;
					return !!(e && e.getTiming && e.getTiming().iterations === Infinity);
				}
				function sweep() {
					swept = false;
					if (!document.getAnimations) return;
					var all = document.getAnimations();
					// read everything first, then pause: a pause between two reads would make the browser
					// redo the page's style once per animation
					var take = [];
					for (var i = 0; i < all.length; i++) {
						var a = all[i];
						if (seen.has(a)) continue;
						var t = a.effect && a.effect.target;
						// one-off animations, and a page's own endless one that asks to stay smooth, are left alone
						if (!t || !endless(a) || (t.closest && t.closest('[data-fx-smooth]'))) {
							seen.add(a);
							continue;
						}
						// paused right now (a hidden tab's CSS pause): look again at the next sweep
						if (a.playState !== 'running') continue;
						seen.add(a);
						take.push([a, a.currentTime || 0, t]);
					}
					for (var j = 0; j < take.length; j++) {
						var b = take[j][0], el = take[j][2];
						b.pause();
						held.set(b, take[j][1]);
						// a CSS animation ends when its element's style drops it: not ours any more
						b.addEventListener('cancel', drop);
						b.addEventListener('finish', drop);
						if (io && !shown.has(el)) {
							shown.set(el, true);
							io.observe(el);
						}
					}
				}
				function drop(e) {
					held.delete(e.target);
				}
				// Resting parts (2026-11-21, the user's "Lugna operatörerna"): an animation inside an element with
				// data-fx-rest stands still, like one off screen (OperatorTag lets one squad member move at a time).
				// Looked up once per element and kept until some data-fx-rest changes.
				var restGen = 0;
				var restAt = new WeakMap(); // element -> [restGen, resting]
				function resting(t) {
					var c = restAt.get(t);
					if (c && c[0] === restGen) return c[1];
					var r = !!(t.closest && t.closest('[data-fx-rest]'));
					restAt.set(t, [restGen, r]);
					return r;
				}
				if (typeof MutationObserver === 'function')
					new MutationObserver(function () {
						restGen++;
					}).observe(html, { subtree: true, attributes: true, attributeFilter: ['data-fx-rest'] });
				var swept = false;
				function soon() {
					if (swept) return;
					swept = true;
					setTimeout(sweep, 0);
				}
				var last = performance.now();
				function step() {
					var now = performance.now();
					var dt = Math.min(now - last, 250);
					last = now;
					var moving = 0;
					if (!document.hidden && !html.hasAttribute('data-still')) {
						held.forEach(function (time, a) {
							var t = a.effect && a.effect.target;
							if (!t || !t.isConnected) {
								held.delete(a);
								return;
							}
							if (shown.get(t) === false || resting(t)) return;
							time += dt;
							held.set(a, time);
							a.currentTime = time;
							moving++;
						});
						if (moving) fx.steps++;
					}
					fx.held = held.size;
					fx.moving = moving;
					setTimeout(step, 1000 / fx.fps);
				}
				// once the page's HTML is in (before anything is drawn), for every animation that starts, and
				// now and then for animations made by script (they send no animationstart)
				document.addEventListener('DOMContentLoaded', sweep);
				document.addEventListener('animationstart', soon, true);
				setInterval(soon, 2000);
				setTimeout(step, 1000 / FPS);
			})();
		</script>
		<script>
			// Right after a new version goes live, a browser can still hold the previous page (GitHub Pages
			// lets it reuse a page for 10 minutes) while that version's build files are already deleted: the
			// page then shows up without its styles (seen 2026-11-10 after five deploys in 15 minutes). When
			// one of our build files fails to load, reload once to get the current version. The flag stops a
			// loop and is cleared 10 s after a good load, so a later deploy can recover the same way.
			// If the one reload didn't help (or storage is blocked, so we can't know), say so in plain words
			// with a Reload button instead of leaving a broken page (no automatic loop).
			(function () {
				var KEY = 'mw4-camo-grind:reloaded';
				var shown = false;
				function explain() {
					if (shown) return;
					shown = true;
					var show = function () {
						var box = document.createElement('div');
						box.setAttribute('role', 'alert');
						box.style.cssText =
							'position:fixed;left:12px;right:12px;bottom:12px;z-index:2147483647;max-width:560px;margin:0 auto;padding:14px 16px;border-radius:10px;background:#111;color:#fff;font:15px/1.45 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.5)';
						box.innerHTML =
							'<p style="margin:0 0 10px">Part of the page didn’t load, probably because a new version just went live. Your ticks are safe in this browser.</p>';
						var btn = document.createElement('button');
						btn.type = 'button';
						btn.textContent = 'Reload the page';
						btn.style.cssText = 'min-height:44px;padding:0 16px;border:0;border-radius:999px;background:#ff4418;color:#000;font:600 15px system-ui,sans-serif;cursor:pointer';
						btn.onclick = function () {
							location.reload();
						};
						box.appendChild(btn);
						document.body.appendChild(box);
					};
					if (document.body) show();
					else addEventListener('DOMContentLoaded', show);
				}
				function recover() {
					try {
						if (sessionStorage.getItem(KEY)) return explain();
						sessionStorage.setItem(KEY, '1');
					} catch (e) {
						return explain();
					}
					location.reload();
				}
				addEventListener(
					'error',
					function (e) {
						var el = e.target;
						var url = el && (el.href || el.src);
						if (typeof url === 'string' && url.indexOf('/_app/immutable/') !== -1) recover();
					},
					true
				);
				addEventListener('unhandledrejection', function (e) {
					var m = String((e.reason && e.reason.message) || e.reason || '');
					if (/dynamically imported module|Importing a module script failed/i.test(m)) recover();
				});
				addEventListener('load', function () {
					setTimeout(function () {
						try {
							sessionStorage.removeItem(KEY);
						} catch (e) {}
					}, 10000);
				});
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
