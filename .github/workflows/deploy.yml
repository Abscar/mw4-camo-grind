# Builds the tracker and publishes it to GitHub Pages on every push to main.
# Based on the SvelteKit adapter-static docs (https://svelte.dev/docs/kit/adapter-static).
name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'
  # Every hour: look for new COD headlines (news banner + news buddy). The site is only rebuilt
  # when there are new ones; an hour without news stops after the check.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build_site:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Fetch the latest COD headlines (never fails the build)
        id: news
        run: npm run news

      # Pushes and manual runs always publish; the hourly check only when there are new headlines.
      - name: Decide whether to publish
        id: decide
        run: echo "publish=${{ github.event_name != 'schedule' || steps.news.outputs.changed == 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.decide.outputs.publish == 'true'
        run: npm ci

      - name: Check and test
        if: steps.decide.outputs.publish == 'true'
        run: |
          npm run check
          npm test

      - name: Configure Pages
        if: steps.decide.outputs.publish == 'true'
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        if: steps.decide.outputs.publish == 'true'
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload Artifacts
        if: steps.decide.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'build/'
          include-hidden-files: true

  deploy:
    needs: build_site
    if: needs.build_site.outputs.publish == 'true'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
