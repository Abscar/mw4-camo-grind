# Builds the tracker and publishes it to GitHub Pages on every push to main.
# Based on the SvelteKit adapter-static docs (https://svelte.dev/docs/kit/adapter-static).
name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'
  # rebuild every morning so the news buddy's COD headlines stay fresh (06:15 UTC)
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and test
        run: |
          npm run check
          npm test

      - name: Fetch today's COD headlines (never fails the build)
        run: npm run news

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'build/'
          include-hidden-files: true

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
