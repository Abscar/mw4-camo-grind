<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
	<!-- MW4 Camo Grind app icon: Abscar's bronze cyborg skull with the holk (our own drawing, from OperatorTag) -->
	<defs>
		<radialGradient id="bg" cx="0.5" cy="0.4" r="0.78">
			<stop offset="0" stop-color="#4f140b" />
			<stop offset="0.55" stop-color="#2a0f08" />
			<stop offset="1" stop-color="#140806" />
		</radialGradient>
		<radialGradient id="halo">
			<stop offset="0" stop-color="#ff3a1a" stop-opacity="0.5" />
			<stop offset="1" stop-color="#ff3a1a" stop-opacity="0" />
		</radialGradient>
		<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#140806" stop-opacity="0" />
			<stop offset="1" stop-color="#140806" stop-opacity="0.95" />
		</linearGradient>
		<linearGradient id="bronze" x1="0" y1="0" x2="0.4" y2="1">
			<stop offset="0" stop-color="#fff0c4" />
			<stop offset="0.22" stop-color="#d9ac62" />
			<stop offset="0.5" stop-color="#7a5326" />
			<stop offset="0.74" stop-color="#e0b874" />
			<stop offset="1" stop-color="#5b3c18" />
		</linearGradient>
		<linearGradient id="bronze-dark" x1="0" y1="0" x2="0.2" y2="1">
			<stop offset="0" stop-color="#e2bd7c" />
			<stop offset="0.45" stop-color="#6e4a20" />
			<stop offset="1" stop-color="#2e1e0b" />
		</linearGradient>
		<radialGradient id="grime" cx="0.3" cy="0.7" r="0.8">
			<stop offset="0" stop-color="#1a0f05" stop-opacity="0.45" />
			<stop offset="1" stop-color="#1a0f05" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="red">
			<stop offset="0" stop-color="#ff2a2a" stop-opacity="0.95" />
			<stop offset="1" stop-color="#ff2a2a" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="ember">
			<stop offset="0" stop-color="#ff8a1a" stop-opacity="0.95" />
			<stop offset="1" stop-color="#ff5a00" stop-opacity="0" />
		</radialGradient>
		<filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
			<feGaussianBlur stdDeviation="2.2" />
		</filter>
		<clipPath id="tile"><rect width="64" height="64" rx="13" /></clipPath>
	</defs>

	<g clip-path="url(#tile)">
		<rect width="64" height="64" fill="url(#bg)" />
		<circle cx="31" cy="29" r="27" fill="url(#halo)" />
		<circle cx="32" cy="32" r="28" fill="none" stroke="#ff4418" stroke-opacity="0.32" stroke-width="0.7" stroke-dasharray="3.2 2.2" />

		<g transform="translate(30.5 33.4) scale(0.74) translate(-37.75 -33.5)">
			<!-- smoke rising from the holk (behind the skull) -->
			<g filter="url(#soft)" fill="#e2e7e2">
				<circle cx="62.6" cy="39" r="3.6" opacity="0.6" />
				<circle cx="61" cy="32" r="5.4" opacity="0.55" />
				<circle cx="56.5" cy="22" r="6.4" opacity="0.4" />
				<circle cx="60" cy="11" r="7" opacity="0.28" />
			</g>
			<!-- hydraulic neck -->
			<path d="M24 54 L22.5 63.5 M40 54 L41.5 63.5" stroke="url(#bronze-dark)" stroke-width="3.2" stroke-linecap="round" />
			<path d="M29 56 L28.5 64 M35 56 L35.5 64" stroke="#2a1c0c" stroke-width="2" stroke-linecap="round" />
			<path d="M32 56 V64" stroke="url(#bronze)" stroke-width="2.4" />
			<!-- cranium -->
			<path d="M12.5 25 C11.5 11.5 20.5 3 32 3 C43.5 3 52.5 11.5 51.5 25 L50.5 30 C49.5 33.5 47.5 35 45 35.5 L19 35.5 C16.5 35 14.5 33.5 13.5 30 Z" fill="url(#bronze)" stroke="#2a1c0c" stroke-width="0.8" />
			<path d="M12.5 25 C11.5 11.5 20.5 3 32 3 C43.5 3 52.5 11.5 51.5 25 L50.5 30 C49.5 33.5 47.5 35 45 35.5 L19 35.5 C16.5 35 14.5 33.5 13.5 30 Z" fill="url(#grime)" />
			<ellipse cx="24.5" cy="9" rx="6.5" ry="2.6" fill="#fff6dc" opacity="0.4" />
			<path d="M32 3.5 V13 M20.5 8.5 C25 10.8 39 10.8 43.5 8.5 M13.2 21 C16 20 17 15 16.5 12 M50.8 21 C48 20 47 15 47.5 12" stroke="#2a1c0c" stroke-opacity="0.55" stroke-width="0.8" fill="none" />
			<path d="M14.5 19.8 C20 16.6 27.5 16.8 31 19.6 L33 19.6 C36.5 16.8 44 16.6 49.5 19.8 L48.8 21.6 L15.2 21.6 Z" fill="url(#bronze-dark)" />
			<!-- eye sockets + red eyes -->
			<path d="M15.5 21.4 L28.8 21 L29.2 27.6 L24 30.8 L16.4 28.4 Z" fill="#050302" />
			<path d="M48.5 21.4 L35.2 21 L34.8 27.6 L40 30.8 L47.6 28.4 Z" fill="#050302" />
			<circle cx="22.6" cy="25.4" r="9" fill="url(#red)" />
			<circle cx="41.4" cy="25.4" r="9" fill="url(#red)" />
			<circle cx="22.6" cy="25.4" r="2.9" fill="#ff3a3a" />
			<circle cx="41.4" cy="25.4" r="2.9" fill="#ff3a3a" />
			<circle cx="23.4" cy="24.6" r="0.9" fill="#ffd6d6" />
			<circle cx="42.2" cy="24.6" r="0.9" fill="#ffd6d6" />
			<!-- nose -->
			<path d="M30.2 29 L33.8 29 L33.1 34 L32 35.2 L30.9 34 Z" fill="#050302" />
			<!-- cheekbones -->
			<path d="M13.6 28.6 L20 31 L19 36 L15 40 L12 35 Z" fill="url(#bronze)" stroke="#2a1c0c" stroke-width="0.6" />
			<path d="M50.4 28.6 L44 31 L45 36 L49 40 L52 35 Z" fill="url(#bronze)" stroke="#2a1c0c" stroke-width="0.6" />
			<!-- jaw pistons -->
			<rect x="11.8" y="36" width="3.8" height="11" rx="1.2" fill="url(#bronze-dark)" stroke="#2a1c0c" stroke-width="0.6" />
			<rect x="48.4" y="36" width="3.8" height="11" rx="1.2" fill="url(#bronze-dark)" stroke="#2a1c0c" stroke-width="0.6" />
			<path d="M12.3 41 H15.1 M48.9 41 H51.7" stroke="#fff0c4" stroke-opacity="0.5" stroke-width="0.6" />
			<path d="M15.6 38 L19.5 41 M48.4 38 L44.5 41" stroke="#3a2610" stroke-width="1.4" stroke-linecap="round" />
			<!-- teeth + jaw -->
			<path d="M20 35.5 H44 V40.4 H20 Z" fill="#0b0703" />
			<g fill="#efe2c4">
				<rect x="20.6" y="35.8" width="2.5" height="4.2" rx="0.5" /><rect x="23.5" y="35.8" width="2.5" height="4.2" rx="0.5" />
				<rect x="26.4" y="35.8" width="2.5" height="4.2" rx="0.5" /><rect x="29.3" y="35.8" width="2.5" height="4.2" rx="0.5" />
				<rect x="32.2" y="35.8" width="2.5" height="4.2" rx="0.5" /><rect x="35.1" y="35.8" width="2.5" height="4.2" rx="0.5" />
				<rect x="38" y="35.8" width="2.5" height="4.2" rx="0.5" /><rect x="40.9" y="35.8" width="2.5" height="4.2" rx="0.5" />
			</g>
			<path d="M18.5 40.4 H45.5 L44.5 47 C43.5 52 39 55.5 32 55.5 C25 55.5 20.5 52 19.5 47 Z" fill="url(#bronze-dark)" stroke="#2a1c0c" stroke-width="0.8" />
			<path d="M20.8 40.4 H43.2 V44 H20.8 Z" fill="#0b0703" />
			<g fill="#d9caa6">
				<rect x="21.2" y="40.6" width="2.3" height="3.2" rx="0.5" /><rect x="24" y="40.6" width="2.3" height="3.2" rx="0.5" />
				<rect x="26.8" y="40.6" width="2.3" height="3.2" rx="0.5" /><rect x="29.6" y="40.6" width="2.3" height="3.2" rx="0.5" />
				<rect x="32.4" y="40.6" width="2.3" height="3.2" rx="0.5" /><rect x="35.2" y="40.6" width="2.3" height="3.2" rx="0.5" />
				<rect x="38" y="40.6" width="2.3" height="3.2" rx="0.5" /><rect x="40.6" y="40.6" width="2.3" height="3.2" rx="0.5" />
			</g>
			<path d="M24.5 50.5 C28.5 53 35.5 53 39.5 50.5" stroke="#fff0c4" stroke-opacity="0.3" stroke-width="0.8" fill="none" />
			<!-- the holk -->
			<path d="M40.25 39.42 L61.9 41.2 Q64 45.2 60.1 49.1 L39.75 41.78 Z" fill="#f3efe4" stroke="#c9c1ab" stroke-width="0.5" />
			<path d="M40.25 39.42 L44.33 39.8 L43.67 43.2 L39.75 41.78 Z" fill="#cdb98f" />
			<path d="M41.4 39.6 L41 42.2 M42.6 39.7 L42.2 42.6" stroke="#a8935f" stroke-width="0.4" />
			<path d="M47 41.4 L57.5 42.8 M48.5 44.3 L58.5 47" stroke="#d6cfbb" stroke-width="0.6" stroke-linecap="round" />
			<ellipse cx="61.9" cy="45.1" rx="1.8" ry="4" transform="rotate(12 61.9 45.1)" fill="#7a7672" />
			<circle cx="62.6" cy="45.2" r="7.5" fill="url(#ember)" />
			<ellipse cx="62.6" cy="45.2" rx="1.1" ry="3" transform="rotate(12 62.6 45.2)" fill="#ff8a1a" />
		</g>
		<rect y="50" width="64" height="14" fill="url(#fade)" />
	</g>
</svg>
